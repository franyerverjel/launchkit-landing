# =============================================================================
# Deploy template — LaunchKit Landing (Astro)
# =============================================================================
#
# Manual-trigger template (`workflow_dispatch`). The landing is a static
# Astro site, so the natural deploy targets are CDNs / static hosts that
# accept a built directory:
#
#   1. **Cloudflare Pages** — connect the repo in the Cloudflare dashboard
#      and skip CI entirely. Cloudflare runs `npm run build` for you. Best
#      DX, no GitHub Action needed.
#
#   2. **Netlify** — same story, GitHub integration runs the build.
#
#   3. **Vercel** — `vercel deploy --prod` action. Their Astro support is
#      first-class.
#
#   4. **VPS via rsync** — keep this template, fill in the secrets below.
#      Useful if the landing lives on the same VPS as the API.
#
# Required secrets (only for the rsync path):
#
#   SSH_PRIVATE_KEY     OpenSSH private key (no passphrase)
#   VPS_HOST            IP / hostname
#   VPS_USERNAME        SSH user
#   VPS_TARGET_DIR      Absolute path the static site lives on, e.g.
#                       /var/www/launchasaas.dev
# =============================================================================

name: Deploy Landing

on:
  workflow_dispatch:
  # Uncomment to redeploy on every push to main:
  # push:
  #   branches: [main]

# Least privilege — deploy only reads the repo (it rsyncs over SSH).
permissions:
  contents: read

jobs:
  deploy:
    name: Build & rsync to VPS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: rsync dist/ to VPS
        run: |
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts
          rsync -avz --delete \
            ./dist/ \
            "${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_HOST }}:${{ secrets.VPS_TARGET_DIR }}/"
